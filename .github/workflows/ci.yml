name: test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  node:
    name: node v${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
        name: setup env
        with:
          nodeVersion: ${{ matrix.node-version }}

      - name: Build Packages
        run: yarn build

      - name: Test
        run: yarn test

      - name: Node.js integrity check
        run: yarn bob check

      # - name: Test example ESM Build
      #   run: yarn workspace javascript-esm-example run build-client

      # - name: Test example CJS Build
      #   run: yarn workspace javascript-cjs-example run build-client
